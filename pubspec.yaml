name: kelibu
description: "Yeni nesil kelime öğrenme uygulaması"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:

    sdk: flutter
  flutter_tts:
  http: ^1.1.2
  cupertino_icons: ^1.0.2
  provider: 6.1.1
  shimmer: ^2.0.0
  flutter_staggered_animations: 1.0.0 # Bu satırı ekleyin
  pull_to_refresh: 2.0.0
  flutter_neumorphic: ^3.1.0
  swiping_card_deck: ^1.3.0
  flip_card: ^0.7.0
  rxdart: ^0.27.0
  animate_do: ^3.1.2
  google_fonts: ^4.0.5
  another_flushbar: ^1.12.30
  badges: ^3.1.2
  flutter_animated_button: ^2.0.3
  shared_preferences: ^2.0.12
  hive: ^2.2.3
  audioplayers: ^5.2.1
  video_player: ^2.8.1
  flutter_staggered_grid_view: ^0.4.0
  path_provider: ^2.1.1
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  flutter_translate: ^4.0.4
  animated_text_kit: ^4.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_tts:

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/images/
    - assets/correct.wav
    - assets/wrong.wav
    - assets/splash_video.mp4

